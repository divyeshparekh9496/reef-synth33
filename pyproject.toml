[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reefsynth"
version = "0.1.0"
description = "Synthetic coral-farm data engine and NVIDIA Nemotron agent crew on Nebius Token Factory"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn==1.9.1",
  "joblib>=1.3",
  "openai>=1.40",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.5",
]

[project.optional-dependencies]
tracing = ["langsmith>=0.1"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
reefsynth = "reefsynth.cli:main"

[tool.setuptools.packages.find]
include = ["reefsynth*"]

[tool.setuptools.package-data]
reefsynth = ["static/*"]
